<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
  <title id="title">Sequence Models and Rating Activity</title>
  <desc id="desc">Original and reordered timestamp baskets lead to the same held-out future rating target.</desc>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#dce2eb"/>
    </pattern>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#334155" flood-opacity="0.1"/>
    </filter>
    <g id="rating-pair">
      <rect x="0" y="0" width="68" height="58" rx="10" fill="#fff" stroke="#dbe3ee" stroke-width="2"/>
      <rect x="77" y="0" width="68" height="58" rx="10" fill="#fff" stroke="#dbe3ee" stroke-width="2"/>
      <path d="m34 10 5.5 11.2 12.4 1.8-9 8.8 2.2 12.4L34 38.3l-11.1 5.9 2.2-12.4-9-8.8 12.4-1.8z" fill="currentColor"/>
      <path d="m111 10 5.5 11.2 12.4 1.8-9 8.8 2.2 12.4-11.1-5.9-11.1 5.9 2.2-12.4-9-8.8 12.4-1.8z" fill="currentColor"/>
    </g>
  </defs>

  <rect width="1200" height="960" fill="#fff"/>
  <rect width="1200" height="960" fill="url(#dots)"/>
  <text x="600" y="119" text-anchor="middle" fill="#3b82f6" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4">BASKET-LEVEL EVALUATION</text>
  <text x="600" y="211" text-anchor="middle" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="700">Sequence Models</text>
  <text x="600" y="302" text-anchor="middle" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="700">Rating Activity</text>
  <text x="600" y="353" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Ahnaf An Nafee</text>

  <rect x="55" y="390" width="1090" height="500" rx="24" fill="#fff" stroke="#d9e1ec" stroke-width="2" filter="url(#card-shadow)"/>
  <text x="91" y="442" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="2">ORIGINAL</text>
  <text x="91" y="660" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="2">PERMUTED</text>

  <rect x="90" y="464" width="190" height="145" rx="17" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
  <text x="113" y="505" fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">t1</text>
  <use href="#rating-pair" x="112" y="528" color="#3b82f6"/>
  <rect x="305" y="464" width="190" height="145" rx="17" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="3"/>
  <text x="328" y="505" fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">t2</text>
  <use href="#rating-pair" x="327" y="528" color="#8b5cf6"/>
  <rect x="520" y="464" width="190" height="145" rx="17" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
  <text x="543" y="505" fill="#b45309" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">t3</text>
  <use href="#rating-pair" x="542" y="528" color="#f59e0b"/>

  <rect x="90" y="682" width="190" height="145" rx="17" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
  <text x="113" y="723" fill="#b45309" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">t3</text>
  <use href="#rating-pair" x="112" y="746" color="#f59e0b"/>
  <rect x="305" y="682" width="190" height="145" rx="17" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
  <text x="328" y="723" fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">t1</text>
  <use href="#rating-pair" x="327" y="746" color="#3b82f6"/>
  <rect x="520" y="682" width="190" height="145" rx="17" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="3"/>
  <text x="543" y="723" fill="#6d28d9" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">t2</text>
  <use href="#rating-pair" x="542" y="746" color="#8b5cf6"/>

  <path d="M711 536c71 0 70 91 118 91M711 754c71 0 70-91 118-91" fill="none" stroke="#9aa8bd" stroke-width="5" stroke-linecap="round"/>
  <circle cx="828" cy="645" r="9" fill="#8b5cf6"/>
  <path d="M837 645h25" fill="none" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>
  <path d="m851 636 12 9-12 9" fill="none" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="865" y="548" width="238" height="193" rx="17" fill="#f8fafc" stroke="#9aa8bd" stroke-width="3" stroke-dasharray="9 8"/>
  <text x="984" y="599" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="2">HELD-OUT</text>
  <rect x="931" y="619" width="106" height="79" rx="13" fill="#e8edf5" stroke="#cbd5e1" stroke-width="2"/>
  <text x="984" y="674" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="53" font-weight="700">?</text>
  <text x="984" y="777" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Future target</text>
</svg>
