  <text x="174" y="480" fill="#f5f3ff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Popularity</text>
  <text x="130" y="526" fill="#b5bdce" font-family="Arial, sans-serif" font-size="23">Transparent baseline</text>

