<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Recommendation Decision Lab</title>
  <desc id="desc">A popularity baseline and a personalized challenger pass through a validation gate to an active recommendation route.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#E5E7EB"/>
    </pattern>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1F2937" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#FAF9F6"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="30" y="28" width="1140" height="574" rx="20" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>

  <text x="225" y="96" fill="#3B82F6" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="3">RESEARCH ENGINEERING</text>
  <text x="225" y="148" fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">Recommendation Decision Lab</text>
  <text x="225" y="182" fill="#6B7280" font-family="Arial, Helvetica, sans-serif" font-size="23">When does personalization earn a route?</text>

  <path d="M458 344 H524" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
  <path d="M742 344 H676" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
  <path d="M600 397 V438" stroke="#6B7280" stroke-width="2" stroke-linecap="round"/>
  <path d="m517 339 8 5-8 5" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m683 339-8 5 8 5" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m595 431 5 8 5-8" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#card-shadow)">
    <rect x="238" y="262" width="220" height="164" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="742" y="262" width="220" height="164" rx="12" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="524" y="291" width="152" height="106" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <rect x="460" y="439" width="280" height="93" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  </g>

  <circle cx="269" cy="294" r="10" fill="#3B82F6"/>
  <text x="288" y="302" fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Popularity</text>
  <text x="259" y="333" fill="#6B7280" font-family="Arial, Helvetica, sans-serif" font-size="15">Reliable fallback</text>
  <rect x="259" y="354" width="163" height="10" rx="5" fill="#E5E7EB"/>
  <rect x="259" y="354" width="139" height="10" rx="5" fill="#3B82F6"/>
  <rect x="259" y="375" width="163" height="10" rx="5" fill="#E5E7EB"/>
  <rect x="259" y="375" width="105" height="10" rx="5" fill="#3B82F6"/>

  <circle cx="773" cy="294" r="10" fill="#8B5CF6"/>
  <text x="792" y="302" fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Personalized</text>
  <text x="763" y="333" fill="#6B7280" font-family="Arial, Helvetica, sans-serif" font-size="15">Shadow challenger</text>
  <rect x="763" y="354" width="163" height="10" rx="5" fill="#E5E7EB"/>
  <rect x="763" y="354" width="122" height="10" rx="5" fill="#8B5CF6"/>
  <rect x="763" y="375" width="163" height="10" rx="5" fill="#E5E7EB"/>
  <rect x="763" y="375" width="149" height="10" rx="5" fill="#8B5CF6"/>

  <circle cx="600" cy="324" r="13" fill="#F59E0B"/>
  <path d="m594 324 4 4 8-9" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="358" fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Validation</text>
  <text x="600" y="380" fill="#6B7280" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle">gate</text>

  <circle cx="492" cy="470" r="10" fill="#10B981"/>
  <text x="513" y="478" fill="#1F2937" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Active route</text>
  <text x="481" y="509" fill="#6B7280" font-family="Arial, Helvetica, sans-serif" font-size="16">Measured choice, visible fallback</text>

  <text x="225" y="574" fill="#6B7280" font-family="Arial, Helvetica, sans-serif" font-size="17">Ahnaf An Nafee</text>
</svg>
